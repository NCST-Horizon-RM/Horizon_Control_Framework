name: 文档任务
description: 补充或修正文档、注释、使用流程
title: "[docs] "
labels: ["docs"]
body:
  - type: textarea
    id: target
    attributes:
      label: 文档目标
      description: 说明需要补充、修正或删除什么内容。
    validations:
      required: true

  - type: textarea
    id: files
    attributes:
      label: 涉及文件
      placeholder: |
        - README.md
        - Boards/README.md
        - CONTRIBUTING.md
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: 原因
      description: 说明当前文档哪里不准确、不完整或容易误导。
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      placeholder: |
        - [ ] 描述和当前实现一致
        - [ ] 示例命令可执行
        - [ ] 新人能按文档完成操作
    validations:
      required: true
