name: Build Firmware

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  # 搜索 Boards/*/App/* 下的所有机器人，生成构建矩阵
  discover:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5

      - name: Validate repository scripts and JSON
        run: |
          python3 -c "import ast, pathlib; ast.parse(pathlib.Path('scripts/generate_cmake_presets.py').read_text())"
          python3 -m json.tool CMakePresets.json > /dev/null

      - name: Verify generated CMake presets
        run: python3 scripts/generate_cmake_presets.py --check

      - id: set
        run: |
          matrix=$(for d in Boards/*/App/*; do
            [ -d "$d" ] || continue
            board=$(basename "$(dirname "$(dirname "$d")")")
            app=$(basename "$d")
            preset="${board}-${app}-Release"
            printf '{"board":"%s","app":"%s","preset":"%s"}\n' "$board" "$app" "$preset"
          done | jq -sc .)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: discover
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v5

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi

      - name: Configure
        run: cmake --preset "${{ matrix.preset }}"

      - name: Build
        run: cmake --build "build/${{ matrix.preset }}" -j

      - name: Upload firmware
        uses: actions/upload-artifact@v6
        with:
          name: firmware-${{ matrix.preset }}
          path: |
            build/${{ matrix.preset }}/*.hex
            build/${{ matrix.preset }}/*.bin
          if-no-files-found: error
