name: Build Firmware

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  # 自动发现 Boards/*/App/* 下的所有机器人，生成构建矩阵
  # 新增机器人只需建目录，无需改本文件
  discover:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: set
        run: |
          matrix=$(for d in Boards/*/App/*; do
            [ -d "$d" ] || continue
            board=$(basename "$(dirname "$(dirname "$d")")")
            app=$(basename "$d")
            printf '{"board":"%s","app":"%s"}\n' "$board" "$app"
          done | jq -sc .)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: discover
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE=Boards/${{ matrix.board }}/cmake/gcc-arm-none-eabi.cmake \
            -DACTIVE_BOARD=${{ matrix.board }} \
            -DACTIVE_APP=${{ matrix.app }} \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.board }}-${{ matrix.app }}
          path: |
            build/*.hex
            build/*.bin
          if-no-files-found: error
